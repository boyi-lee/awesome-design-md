name: Packaging OS CI

on:
  push:
    paths:
      - 'packaging-os/**'
      - '.github/workflows/packaging-os-ci.yml'
  pull_request:
    paths:
      - 'packaging-os/**'
      - '.github/workflows/packaging-os-ci.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - run: python packaging-os/scripts/validate_job.py packaging-os/examples/W0987/job.yaml
      - run: python -m unittest discover packaging-os/tests
